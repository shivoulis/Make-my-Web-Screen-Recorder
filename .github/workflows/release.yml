# Builds the installer from this repository and publishes it as a GitHub release.
# Push a tag like v2.4.0 to release; "Run workflow" builds without publishing (for testing).
#
# Code signing (SignPath Foundation): once the project is approved, add
#   - repository secret   SIGNPATH_API_TOKEN
#   - repository variable SIGNPATH_ORGANIZATION_ID
#   - optional variables  SIGNPATH_PROJECT_SLUG / SIGNPATH_POLICY_SLUG (defaults below)
# and the installer is signed before it is published. Without them, releases are unsigned.

name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      FFMPEG_VERSION: '9.0.2'
    steps:
      - uses: actions/checkout@v5

      - name: Get FFmpeg (gyan.dev full build)
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/ffmpeg-$env:FFMPEG_VERSION-full_build.zip"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $bin

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build app and installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1

      - name: Upload unsigned installer
        id: upload
        uses: actions/upload-artifact@v5
        with:
          name: installer
          path: dist/MakeMyWebScreenRecorder-Setup-*.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Make-my-Web-Screen-Recorder' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = if (Test-Path signed) { 'signed' } else { 'dist' }
          $installer = Get-ChildItem $dir -Filter 'MakeMyWebScreenRecorder-Setup-*.exe' | Select-Object -First 1
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $notes = "release-notes/$env:GITHUB_REF_NAME.md"
          if (Test-Path $notes) {
            gh release create $env:GITHUB_REF_NAME $installer.FullName --title "Make my Web Screen Recorder $version" --notes-file $notes
          } else {
            gh release create $env:GITHUB_REF_NAME $installer.FullName --title "Make my Web Screen Recorder $version" --generate-notes
          }
